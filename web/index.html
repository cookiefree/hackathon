<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Second Brain · School</title>
<style>
  :root {
    --bg: #f6f7f9;
    --surface: #ffffff;
    --fg: #16181d;
    --muted: #6b7280;
    --faint: #9ca3af;
    --line: #e7e9ee;
    --accent: #4f46e5; --on-accent: #fff;
    --accent-soft: #eef0ff;
    --ok: #15803d;      --ok-soft: #e8f6ee;
    --warn: #b45309;    --warn-soft: #fdf3e4;
    --bad: #c62828;     --bad-soft: #fdecec;
    --radius: 14px;
    --shadow: 0 1px 2px rgba(16,24,40,.04), 0 1px 3px rgba(16,24,40,.06);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0e1014; --surface: #161920; --fg: #e8eaee; --muted: #9aa1ad; --faint: #6b7280;
      --line: #242832; --accent: #8b8cf8; --on-accent: #0e1014; --accent-soft: #23243a;
      --ok: #4ade80; --ok-soft: #14271c; --warn: #fbbf24; --warn-soft: #2a2213; --bad: #f87171; --bad-soft: #2c1617;
      --shadow: none;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--fg);
    font: 15px/1.5 Inter, ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  .wrap { max-width: 1180px; margin: 0 auto; padding: 28px 24px 64px; }

  /* header */
  header { display: flex; align-items: center; justify-content: space-between; gap: 16px; flex-wrap: wrap; margin-bottom: 28px; }
  .brand { display: flex; align-items: center; gap: 12px; }
  .logo { width: 36px; height: 36px; border-radius: 10px; background: var(--accent); color: var(--on-accent); display: grid; place-items: center; font-weight: 700; }
  .brand h1 { font-size: 18px; margin: 0; font-weight: 650; letter-spacing: -.01em; }
  .brand p { margin: 0; color: var(--muted); font-size: 13px; }

  /* buttons */
  .btn {
    font: inherit; font-size: 14px; font-weight: 500; cursor: pointer;
    background: var(--surface); color: var(--fg); border: 1px solid var(--line);
    padding: 7px 14px; border-radius: 10px; transition: border-color .15s, background .15s;
  }
  .btn:hover { border-color: var(--faint); }
  .btn.primary { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }
  .btn.primary:hover { filter: brightness(1.08); }
  .btn:disabled { opacity: .6; cursor: default; }
  .seg { display: inline-flex; }
  .seg .btn { border-radius: 0; margin-left: -1px; }
  .seg .btn:first-child { border-radius: 10px 0 0 10px; margin-left: 0; }
  .seg .btn:last-child { border-radius: 0 10px 10px 0; }

  /* sections */
  .card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); box-shadow: var(--shadow); }
  .section-head { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; margin: 0 0 14px; }
  .section-head h2 { font-size: 16px; font-weight: 650; margin: 0; letter-spacing: -.01em; }
  .muted { color: var(--muted); font-size: 13px; }

  /* week grid */
  .grid { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 14px; }
  .day { padding: 14px; min-height: 160px; }
  .day.today { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
  .day-head { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 10px; }
  .day-name { font-weight: 600; font-size: 14px; }
  .day-date { color: var(--muted); font-size: 13px; }
  .today .day-date { color: var(--accent); font-weight: 600; }
  .lesson {
    position: relative; padding: 9px 10px 9px 13px; border-radius: 10px; background: var(--bg);
    margin-bottom: 8px; overflow: hidden;
  }
  .lesson::before { content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: 3px; background: var(--c, var(--accent)); }
  .lesson .row { display: flex; justify-content: space-between; gap: 8px; align-items: center; }
  .lesson .subj { font-weight: 600; font-size: 14px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .lesson .time { color: var(--muted); font-size: 12px; font-variant-numeric: tabular-nums; }
  .lesson .meta { color: var(--muted); font-size: 12px; margin-top: 2px; }
  .lesson .note { font-size: 12px; margin-top: 4px; color: var(--warn); }
  .lesson.cancelled { opacity: .75; }
  .lesson.cancelled .subj { text-decoration: line-through; color: var(--muted); }
  .badge { font-size: 11px; font-weight: 600; padding: 2px 7px; border-radius: 999px; white-space: nowrap; }
  .badge.cancelled { background: var(--bad-soft); color: var(--bad); }
  .badge.substituted, .badge.room_changed { background: var(--warn-soft); color: var(--warn); }
  .badge.ok { background: var(--ok-soft); color: var(--ok); }
  .badge.miss { background: var(--bad-soft); color: var(--bad); }
  .empty { color: var(--faint); font-size: 13px; padding: 6px 2px; }

  /* lower area */
  .cols { display: grid; grid-template-columns: 1fr 1.4fr; gap: 20px; margin-top: 36px; align-items: start; }
  .panel { padding: 20px; }
  .hw { display: flex; gap: 12px; padding: 12px 0; border-top: 1px solid var(--line); }
  .hw:first-child { border-top: none; padding-top: 0; }
  .hw .due { flex: none; width: 54px; text-align: center; border-radius: 10px; background: var(--accent-soft); color: var(--accent); padding: 6px 0; line-height: 1.15; }
  .hw .due b { display: block; font-size: 17px; }
  .hw .due span { font-size: 11px; text-transform: uppercase; letter-spacing: .04em; }
  .hw .subj { font-weight: 600; font-size: 14px; }
  .hw .txt { font-size: 14px; white-space: pre-wrap; margin-top: 2px; }

  textarea {
    width: 100%; min-height: 140px; resize: vertical; font: inherit; font-size: 14px;
    background: var(--bg); color: var(--fg); border: 1px solid var(--line); border-radius: 10px; padding: 12px;
  }
  textarea:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
  .actions { display: flex; align-items: center; gap: 12px; margin-top: 10px; }
  .res:empty { display: none; }
  .res { margin-top: 18px; border-top: 1px solid var(--line); padding-top: 16px; }
  .res h3 { font-size: 12px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); margin: 16px 0 6px; font-weight: 600; }
  .res h3:first-child { margin-top: 0; }
  .res ul { margin: 0; padding-left: 18px; }
  .res li { margin: 3px 0; }
  .res .cc { list-style: none; padding: 0; }
  .res .cc li { display: flex; gap: 8px; align-items: baseline; }

  @media (max-width: 960px) {
    .grid { grid-template-columns: 1fr; }
    .day { min-height: 0; }
    .cols { grid-template-columns: 1fr; }
  }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="brand">
      <div class="logo">S</div>
      <div>
        <h1>Second Brain</h1>
        <p id="range">&nbsp;</p>
      </div>
    </div>
    <div style="display:flex;align-items:center;gap:12px">
      <span id="status" class="muted"></span>
      <div class="seg">
        <button class="btn" id="prev" aria-label="Previous week">&larr;</button>
        <button class="btn" id="today">This week</button>
        <button class="btn" id="next" aria-label="Next week">&rarr;</button>
      </div>
    </div>
  </header>

  <div class="grid" id="grid"></div>

  <div class="cols">
    <section class="card panel">
      <div class="section-head"><h2>Open homework</h2><span id="hwcount" class="muted"></span></div>
      <div id="hw"></div>
    </section>

    <section class="card panel">
      <div class="section-head"><h2>Analyze a lesson</h2><span class="muted">notes + homework cross-check</span></div>
      <textarea id="tx" placeholder="Paste a lesson transcript…"></textarea>
      <div class="actions">
        <button class="btn primary" id="go">Analyze</button>
        <span id="astatus" class="muted"></span>
      </div>
      <div class="res" id="res"></div>
    </section>
  </div>
</div>

<script>
let week = 0;
const DAYS = ["Monday","Tuesday","Wednesday","Thursday","Friday"];
const STATUS = { cancelled: "Cancelled", substituted: "Substitute", room_changed: "Room change" };
const $ = id => document.getElementById(id);
const hm = iso => iso.slice(11,16);
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const fmt = (d, o) => d.toLocaleDateString("en-GB", o);

// stable colour per subject code
const hue = s => { let h = 0; for (const c of s) h = (h * 31 + c.charCodeAt(0)) % 360; return h; };
const color = s => `hsl(${hue(s.split("-")[0])} 65% 55%)`;

async function loadTimetable() {
  $("status").textContent = "Loading…";
  try {
    const d = await (await fetch(`/api/timetable?week=${week}`)).json();
    const start = new Date(d.start + "T00:00"), end = new Date(d.end + "T00:00");
    $("range").textContent = `${fmt(start, {day:"numeric", month:"short"})} – ${fmt(end, {day:"numeric", month:"short", year:"numeric"})}`;
    $("status").textContent = `${d.lessons.length} lessons`;
    const todayStr = new Date().toLocaleDateString("sv");
    $("grid").innerHTML = DAYS.map((name, i) => {
      const day = new Date(start); day.setDate(start.getDate() + i);
      const ds = day.toLocaleDateString("sv");
      const rows = d.lessons.filter(l => l.start.startsWith(ds)).map(l => `
        <div class="lesson ${l.status}" style="--c:${color(l.subject)}">
          <div class="row">
            <span class="subj">${esc(l.subject)}</span>
            ${STATUS[l.status] ? `<span class="badge ${l.status}">${STATUS[l.status]}</span>` : `<span class="time">${hm(l.start)}</span>`}
          </div>
          <div class="meta">${STATUS[l.status] ? hm(l.start) + " · " : ""}${esc(l.rooms.join(", ") || "–")} · ${esc(l.teachers.join(", ") || "–")}</div>
          ${l.note ? `<div class="note">${esc(l.note)}</div>` : ""}
        </div>`).join("") || `<div class="empty">No lessons</div>`;
      return `<div class="card day ${ds === todayStr ? "today" : ""}">
        <div class="day-head"><span class="day-name">${name}</span><span class="day-date">${fmt(day, {day:"numeric", month:"short"})}</span></div>
        ${rows}</div>`;
    }).join("");
  } catch (e) {
    $("status").textContent = "Could not load timetable";
  }
}

async function loadHomework() {
  const hw = (await (await fetch("/api/homework")).json())
    .filter(h => !h.completed).sort((a,b) => a.due.localeCompare(b.due));
  $("hwcount").textContent = hw.length ? `${hw.length} open` : "";
  $("hw").innerHTML = hw.map(h => {
    const due = new Date(h.due + "T00:00");
    return `<div class="hw">
      <div class="due"><b>${due.getDate()}</b><span>${fmt(due, {month:"short"})}</span></div>
      <div><div class="subj">${esc(h.subject || "Unknown")} <span class="muted">· ${esc(h.teacher || "–")}</span></div>
      <div class="txt">${esc(h.text)}</div></div></div>`;
  }).join("") || `<div class="empty">Nothing open. Nice.</div>`;
}

$("prev").onclick = () => { week--; loadTimetable(); };
$("next").onclick = () => { week++; loadTimetable(); };
$("today").onclick = () => { week = 0; loadTimetable(); };

const list = (title, xs) => xs.length ? `<h3>${title}</h3><ul>${xs.map(x => `<li>${esc(x)}</li>`).join("")}</ul>` : "";
$("go").onclick = async () => {
  const transcript = $("tx").value.trim();
  if (!transcript) return;
  $("go").disabled = true;
  $("astatus").textContent = "Analyzing…";
  try {
    const r = await fetch("/api/analyze", { method:"POST", headers:{"Content-Type":"application/json"}, body: JSON.stringify({ transcript }) });
    if (!r.ok) { $("astatus").textContent = `Error ${r.status}`; return; }
    const a = await r.json();
    $("astatus").textContent = `${a.lesson ? a.lesson.subject : "Unknown lesson"} · ${a.llm}`;
    const cc = a.crosscheck.map(c => c.in_untis
      ? `<li><span class="badge ok">In Untis</span> ${esc(c.spoken.text)}</li>`
      : `<li><span class="badge miss">Not in Untis</span> ${esc(c.spoken.text)}${c.spoken.due ? ` <span class="muted">· due ${esc(c.spoken.due)}</span>` : ""}</li>`).join("");
    $("res").innerHTML =
      `<h3>Summary</h3><div>${esc(a.note.summary)}</div>` +
      list("Concepts", a.note.concepts) + list("Definitions", a.note.definitions) + list("Test hints", a.note.test_hints) +
      (cc ? `<h3>Homework cross-check</h3><ul class="cc">${cc}</ul>` : "");
  } finally {
    $("go").disabled = false;
  }
};
loadTimetable(); loadHomework();
</script>
</body>
</html>
